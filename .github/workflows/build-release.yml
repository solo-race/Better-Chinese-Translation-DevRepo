name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize release submodule
        run: |
          git submodule update --init --recursive release

      - name: Prepare artifact
        run: |
          mkdir -p BetterChineseTrans
          cp -a release/content release/text release/illustrations release/plugins BetterChineseTrans/
          cp release/modinfo.json release/workshopdata.json release/thumbnail.png BetterChineseTrans/
          zip -r BetterChineseTrans.zip BetterChineseTrans

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            BetterChineseTrans.zip \
            --title "BetterChineseTrans $GITHUB_REF_NAME" \
            --notes "Rain World Chinese localization release."
